# trigger-knowledge-rebuild.yml
#
# Fires a repository_dispatch event to lra-knowledge-explorer whenever
# LaTeX source content lands in the mono-repo on main.
#
# This is the single dispatch point for the entire lra-* constellation:
# leaf repos (lra-common, lra-volume-ii, etc.) sync their content here
# via their own CI, so we only need one trigger here rather than one in
# each leaf repo.
#
# Scoped to paths the extraction pipeline actually reads, so cosmetic
# changes (README, BACKLOG, etc.) don't burn a rebuild unnecessarily.
#
# Required secret: SYNC_PAT
#   A GitHub PAT with `repo` scope — the same one used by the sync
#   workflows in the leaf repos.

name: Trigger Knowledge Explorer Rebuild

on:
  push:
    branches: [main]
    paths:
      - 'volume-ii/**'
      - 'volume-iii/**'
      - 'common/**'
      - 'bibliography/**'
      - 'theorem-explorer/**.py'   # pipeline script changes also warrant a rebuild

  workflow_dispatch:               # manual trigger if needed

jobs:
  dispatch:
    name: Dispatch lra-rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Trigger knowledge explorer rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SYNC_PAT }}
          repository: wsollers/lra-knowledge-explorer
          event-type: lra-rebuild
          client-payload: |
            {
              "source_repo": "${{ github.repository }}",
              "source_ref":  "${{ github.ref }}",
              "triggered_by": "${{ github.actor }}",
              "commit_sha": "${{ github.sha }}"
            }
