name: Build and Publish PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pdf-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build LaTeX Docker image
        run: docker build -t learning-real-analysis-latex -f docker/Dockerfile docker

      - name: Build LaTeX PDF
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            learning-real-analysis-latex \
            latexmk -lualatex -interaction=nonstopmode -file-line-error -synctex=1 -shell-escape main.tex

      - name: Verify PDF output
        run: |
          test -s build/main.pdf
          python3 - <<'PY'
          from pathlib import Path

          pdf = Path("build/main.pdf")
          data = pdf.read_bytes()
          if not data.startswith(b"%PDF-"):
              raise SystemExit("build/main.pdf does not start with a PDF header")
          if b"%%EOF" not in data[-2048:]:
              raise SystemExit("build/main.pdf is missing a PDF EOF trailer")
          PY

      - name: Checkout output repository
        uses: actions/checkout@v4
        with:
          repository: wsollers/lra-volumes-output
          token: ${{ secrets.SYNC_PAT }}
          ref: main
          path: output
          fetch-depth: 0

      - name: Publish PDF
        run: |
          cp build/main.pdf output/learning-real-analysis.pdf
          cd output
          git config core.autocrlf false
          git config user.name "lra-pdf-bot"
          git config user.email "lra-pdf-bot@noreply.github.com"
          git add learning-real-analysis.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to publish"
            exit 0
          fi
          git commit -m "Update Learning Real Analysis PDF"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
