# =========================================================
# Algebra — Ring Hierarchy
# Added for Project Foundation (Halmos Boolean Algebra)
# =========================================================

- id: pred:associative
  name: Associative
  category: algebra
  arity: 2
  arguments: [S, op]
  optional_arguments: []
  formal: "\\forall x,y,z \\in S:\\; x \\mathbin{\\mathrm{op}} (y \\mathbin{\\mathrm{op}} z) = (x \\mathbin{\\mathrm{op}} y) \\mathbin{\\mathrm{op}} z"
  note: "Associativity of a binary operation op on a set S."

- id: pred:commutative
  name: Commutative
  category: algebra
  arity: 2
  arguments: [S, op]
  optional_arguments: []
  formal: "\\forall x,y \\in S:\\; x \\mathbin{\\mathrm{op}} y = y \\mathbin{\\mathrm{op}} x"
  note: "Commutativity of a binary operation op on a set S."

- id: pred:has-identity
  name: HasIdentity
  category: algebra
  arity: 3
  arguments: [S, op, e]
  optional_arguments: []
  formal: "\\forall x \\in S:\\; e \\mathbin{\\mathrm{op}} x = x \\mathbin{\\mathrm{op}} e = x"
  note: "e is a two-sided identity for op on S."

- id: pred:has-inverses
  name: HasInverses
  category: algebra
  arity: 4
  arguments: [S, op, inv, e]
  optional_arguments: []
  formal: "\\forall x \\in S:\\; x \\mathbin{\\mathrm{op}} \\mathrm{inv}(x) = \\mathrm{inv}(x) \\mathbin{\\mathrm{op}} x = e"
  note: "Every element of S has a two-sided inverse under op with identity e."

- id: pred:distributes
  name: Distributes
  category: algebra
  arity: 3
  arguments: [mul, add, S]
  optional_arguments: []
  formal: "\\forall x,y,z \\in S:\\; x \\cdot (y + z) = x \\cdot y + x \\cdot z \\;\\land\\; (y+z) \\cdot x = y \\cdot x + z \\cdot x"
  note: "mul distributes over add on both sides in S."

- id: pred:semigroup
  name: Semigroup
  category: algebra
  arity: 2
  arguments: [S, op]
  optional_arguments: []
  formal: "\\operatorname{Associative}(S, \\mathrm{op})"
  note: "A set S with an associative binary operation."

- id: pred:monoid
  name: Monoid
  category: algebra
  arity: 3
  arguments: [S, op, e]
  optional_arguments: []
  formal: "\\operatorname{Semigroup}(S, \\mathrm{op}) \\land \\operatorname{HasIdentity}(S, \\mathrm{op}, e)"
  note: "A semigroup with a two-sided identity element e."

- id: pred:group
  name: Group
  category: algebra
  arity: 4
  arguments: [S, op, inv, e]
  optional_arguments: []
  formal: "\\operatorname{Monoid}(S, \\mathrm{op}, e) \\land \\operatorname{HasInverses}(S, \\mathrm{op}, \\mathrm{inv}, e)"
  note: "A monoid in which every element has a two-sided inverse."

- id: pred:abelian-group
  name: AbelianGroup
  category: algebra
  arity: 4
  arguments: [S, add, neg, zero]
  optional_arguments: []
  formal: "\\operatorname{Group}(S, +, -, 0) \\land \\operatorname{Commutative}(S, +)"
  note: "A commutative group. The standard additive group structure."

- id: pred:ring
  name: Ring
  category: algebra
  arity: 6
  arguments: [R, add, mul, neg, zero, one]
  optional_arguments: []
  formal: "\\operatorname{AbelianGroup}(R, +, -, 0) \\land \\operatorname{Monoid}(R, \\cdot, 1) \\land \\operatorname{Distributes}(\\cdot, +, R)"
  note: "A ring with unit, following Halmos. Axioms (1)-(3),(5)-(9) of Halmos-Givant."

- id: pred:commutative-ring
  name: CommutativeRing
  category: algebra
  arity: 6
  arguments: [R, add, mul, neg, zero, one]
  optional_arguments: []
  formal: "\\operatorname{Ring}(R, +, \\cdot, -, 0, 1) \\land \\operatorname{Commutative}(R, \\cdot)"
  note: "A ring in which multiplication is also commutative."

- id: pred:idempotent-element
  name: IdempotentElement
  category: algebra
  arity: 3
  arguments: [x, S, mul]
  optional_arguments: []
  formal: "x \\cdot x = x"
  note: "x is idempotent under mul in S. Halmos equation (11)."

- id: pred:idempotent-ring
  name: IdempotentRing
  category: algebra
  arity: 2
  arguments: [R, mul]
  optional_arguments: []
  formal: "\\forall x \\in R:\\; \\operatorname{IdempotentElement}(x, R, \\cdot)"
  note: "Every element of R is idempotent under mul. The defining property of Boolean rings."

- id: pred:characteristic-2
  name: Characteristic2
  category: algebra
  arity: 3
  arguments: [R, add, zero]
  optional_arguments: []
  formal: "\\forall x \\in R:\\; x + x = 0"
  note: "R has characteristic 2. Halmos equation (10). Derived from IdempotentRing."

- id: pred:boolean-ring
  name: BooleanRing
  category: algebra
  arity: 6
  arguments: [R, add, mul, neg, zero, one]
  optional_arguments: []
  formal: "\\operatorname{Ring}(R, +, \\cdot, -, 0, 1) \\land \\operatorname{IdempotentRing}(R, \\cdot)"
  note: "An idempotent ring with unit. Halmos Definition 7. Implies CommutativeRing and Characteristic2."

# =========================================================
# Linear Algebra — Vector Spaces, Maps, Dimension
# Added for LADR (Axler, Linear Algebra Done Right, 4e)
# Chapters 1–3: Vector Spaces, Finite-Dimensional Spaces,
# Linear Maps
# =========================================================

- id: pred:list
  name: List
  category: linear-algebra
  arity: 1
  arguments: [L]
  optional_arguments: []
  formal: "\\exists n \\in \\mathbb{N}_0\\;\\exists x_1,\\ldots,x_n:\\; L = (x_1,\\ldots,x_n)"
  note: "Axler 1.1. An ordered finite collection of n elements. Order and identity of elements both matter. Distinct from a set: (a,b) != (b,a) unless a=b. Distinct from a sequence: lists are finite."

- id: pred:list-equality
  name: ListEquality
  category: linear-algebra
  arity: 2
  arguments: [(x_1,...,x_n), (y_1,...,y_m)]
  optional_arguments: []
  formal: "(x_1,\\ldots,x_n) = (y_1,\\ldots,y_m) \\Longleftrightarrow n = m \\land \\forall k \\le n\\;(x_k = y_k)"
  note: "Two lists are equal iff they have the same length and agree at every position. The predicate proved in prf:list-equality."

- id: pred:Fn
  name: Fn
  category: linear-algebra
  arity: 2
  arguments: [F, n]
  optional_arguments: []
  formal: "\\mathbf{F}^n = \\{(x_1,\\ldots,x_n) : x_1,\\ldots,x_n \\in \\mathbf{F}\\}"
  note: "Axler 1.18. The prototype concrete vector space: all lists of length n over F. F is R or C. Coordinatewise addition and scalar multiplication make F^n a vector space."

- id: pred:closed-under-addition
  name: ClosedUnderAddition
  category: linear-algebra
  arity: 1
  arguments: [U]
  optional_arguments: []
  formal: "\\forall u,v \\in U\\;(u + v \\in U)"
  note: "One of the three conditions in Axler 1.34 (Conditions for a Subspace). Referenced in pred:subspace formal but requires its own entry for use in sqst blocks."

- id: pred:closed-under-scalar-multiplication
  name: ClosedUnderScalarMultiplication
  category: linear-algebra
  arity: 2
  arguments: [U, F]
  optional_arguments: []
  formal: "\\forall a \\in \\mathbf{F}\\;\\forall u \\in U\\;(au \\in U)"
  note: "One of the three conditions in Axler 1.34 (Conditions for a Subspace). Referenced in pred:subspace formal but requires its own entry for use in sqst blocks."

- id: pred:vector-space
  name: VectorSpace
  category: linear-algebra
  arity: 4
  arguments: [V, F, add, scalar-mul]
  optional_arguments: []
  formal: "V \\text{ is a vector space over } \\mathbf{F} \\text{ with addition } + \\text{ and scalar multiplication } \\cdot"
  note: "Axler 1.20. F is R or C. Requires commutativity, associativity, additive identity, additive inverse, multiplicative identity, and both distributive properties."

- id: pred:real-vector-space
  name: RealVectorSpace
  category: linear-algebra
  arity: 1
  arguments: [V]
  optional_arguments: []
  formal: "\\operatorname{VectorSpace}(V, \\mathbb{R}, +, \\cdot)"
  note: "Axler 1.22. A vector space over R."

- id: pred:complex-vector-space
  name: ComplexVectorSpace
  category: linear-algebra
  arity: 1
  arguments: [V]
  optional_arguments: []
  formal: "\\operatorname{VectorSpace}(V, \\mathbb{C}, +, \\cdot)"
  note: "Axler 1.22. A vector space over C."

- id: pred:subspace
  name: Subspace
  category: linear-algebra
  arity: 2
  arguments: [U, V]
  optional_arguments: []
  formal: "U \\subseteq V \\land \\operatorname{VectorSpace}(U) \\land 0 \\in U \\land \\operatorname{ClosedUnderAddition}(U) \\land \\operatorname{ClosedUnderScalarMultiplication}(U)"
  note: "Axler 1.33. U is a subspace of V iff U satisfies the three conditions of 1.34: 0 in U, closed under addition, closed under scalar multiplication."

- id: pred:sum-of-subspaces
  name: SumOfSubspaces
  category: linear-algebra
  arity: 3
  arguments: [W, subspaces, V]
  optional_arguments: []
  formal: "W = V_1 + \\cdots + V_m = \\{v_1 + \\cdots + v_m : v_k \\in V_k\\}"
  note: "Axler 1.36. The sum of subspaces V1,...,Vm is the smallest subspace of V containing all of them."

- id: pred:direct-sum
  name: DirectSum
  category: linear-algebra
  arity: 3
  arguments: [V, subspaces, F]
  optional_arguments: []
  formal: "V = V_1 \\oplus \\cdots \\oplus V_m \\Longleftrightarrow \\text{each } v \\in V \\text{ has a unique representation } v = v_1 + \\cdots + v_m,\\; v_k \\in V_k"
  note: "Axler 1.41. The sum is direct iff the only way to write 0 as a sum is with each component 0."

- id: pred:linear-combination
  name: LinearCombination
  category: linear-algebra
  arity: 4
  arguments: [v, vectors, scalars, V]
  optional_arguments: []
  formal: "v = a_1 v_1 + \\cdots + a_m v_m,\\quad a_k \\in \\mathbf{F}"
  note: "Axler 2.2. v is a linear combination of the list v1,...,vm with scalars a1,...,am."

- id: pred:span
  name: Span
  category: linear-algebra
  arity: 3
  arguments: [S, vectors, V]
  optional_arguments: []
  formal: "S = \\operatorname{span}(v_1, \\ldots, v_m) = \\{a_1 v_1 + \\cdots + a_m v_m : a_k \\in \\mathbf{F}\\}"
  note: "Axler 2.4. The span is the smallest subspace containing all vectors in the list."

- id: pred:spans
  name: Spans
  category: linear-algebra
  arity: 2
  arguments: [vectors, V]
  optional_arguments: []
  formal: "\\operatorname{span}(v_1, \\ldots, v_m) = V"
  note: "Axler 2.7. The list v1,...,vm spans V."

- id: pred:linearly-independent
  name: LinearlyIndependent
  category: linear-algebra
  arity: 2
  arguments: [vectors, V]
  optional_arguments: []
  formal: "a_1 v_1 + \\cdots + a_m v_m = 0 \\Longrightarrow a_1 = \\cdots = a_m = 0"
  note: "Axler 2.15. A list is linearly independent if the only zero linear combination uses all-zero scalars."

- id: pred:linearly-dependent
  name: LinearlyDependent
  category: linear-algebra
  arity: 2
  arguments: [vectors, V]
  optional_arguments: []
  formal: "\\exists a_1, \\ldots, a_m \\in \\mathbf{F}, \\text{ not all } 0{:}\\; a_1 v_1 + \\cdots + a_m v_m = 0"
  note: "Axler 2.17. Negation of LinearlyIndependent."

- id: pred:basis
  name: Basis
  category: linear-algebra
  arity: 2
  arguments: [vectors, V]
  optional_arguments: []
  formal: "\\operatorname{LinearlyIndependent}(v_1,\\ldots,v_n, V) \\land \\operatorname{Spans}(v_1,\\ldots,v_n, V)"
  note: "Axler 2.26. A basis is a linearly independent spanning list. Criterion: every v in V has a unique representation as a linear combination of the basis vectors."

- id: pred:finite-dimensional
  name: FiniteDimensional
  category: linear-algebra
  arity: 1
  arguments: [V]
  optional_arguments: []
  formal: '\exists \text{ list } v_1, \ldots, v_m \in V{:}\; \operatorname{Spans}(v_1,\ldots,v_m, V)'
  note: "Axler 2.9. V is finite-dimensional if some finite list spans it."

- id: pred:infinite-dimensional
  name: InfiniteDimensional
  category: linear-algebra
  arity: 1
  arguments: [V]
  optional_arguments: []
  formal: "\\neg\\operatorname{FiniteDimensional}(V)"
  note: "Axler 2.13. V is infinite-dimensional if no finite list spans it."

- id: pred:dimension
  name: Dimension
  category: linear-algebra
  arity: 2
  arguments: [n, V]
  optional_arguments: []
  formal: "\\dim V = n \\Longleftrightarrow \\text{every basis of } V \\text{ has length } n"
  note: "Axler 2.35. Well-defined by 2.34: any two bases of a finite-dimensional space have the same length."

- id: pred:linear-map
  name: LinearMap
  category: linear-algebra
  arity: 3
  arguments: [T, V, W]
  optional_arguments: []
  formal: 'T : V \to W \land (\forall u,v \in V{:}\; T(u+v) = Tu + Tv) \land (\forall \lambda \in \mathbf{F}, v \in V{:}\; T(\lambda v) = \lambda Tv)'
  note: "Axler 3.1. Additivity and homogeneity. A linear map takes 0 to 0 (3.10)."

- id: pred:null-space
  name: NullSpace
  category: linear-algebra
  arity: 2
  arguments: [N, T]
  optional_arguments: []
  formal: "N = \\operatorname{null} T = \\{v \\in V : Tv = 0\\}"
  note: "Axler 3.11. The null space is a subspace of the domain. T is injective iff null T = {0}."

- id: pred:range-of-map
  name: Range
  category: linear-algebra
  arity: 2
  arguments: [R, T]
  optional_arguments: []
  formal: "R = \\operatorname{range} T = \\{Tv : v \\in V\\}"
  note: "Axler 3.16. The range is a subspace of the codomain. T is surjective iff range T = W."

- id: pred:linear-isomorphism
  name: LinearIsomorphism
  category: linear-algebra
  arity: 3
  arguments: [T, V, W]
  optional_arguments: []
  formal: "\\operatorname{LinearMap}(T,V,W) \\land \\operatorname{Injective}(T) \\land \\operatorname{Surjective}(T)"
  note: "Axler 3D. An invertible linear map. T is an isomorphism iff it is bijective."

- id: pred:isomorphic-vector-spaces
  name: IsomorphicVectorSpaces
  category: linear-algebra
  arity: 2
  arguments: [V, W]
  optional_arguments: []
  formal: '\exists T{:}\; \operatorname{LinearIsomorphism}(T, V, W)'
  note: "Axler 3D. V and W are isomorphic iff there exists an invertible linear map between them. Two finite-dimensional spaces over the same field are isomorphic iff they have the same dimension."

# =========================================================
# Relations, Structure, and Peano Recursion
# =========================================================

- id: pred:relation
  name: Relation
  category: relation
  arity: 3
  arguments: [R, X, Y]
  optional_arguments: []
  formal: "R \\subseteq X \\times Y"
  reading_template: >
    Relation(R,X,Y) \Longleftrightarrow R is a relation from X to Y,
    equivalently R \subseteq X \times Y.
  note: >
    Generic set-theoretic relation predicate. Use this instead of
    creating theorem-specific relation names.

- id: pred:functional-relation
  name: FunctionalRelation
  category: relation
  arity: 3
  arguments: [R, X, Y]
  optional_arguments: []
  formal: >
    Relation(R,X,Y) \land
    \forall x \in X \; \forall y_0,y_1 \in Y \;
    (((x,y_0) \in R \land (x,y_1) \in R) \rightarrow y_0=y_1)
  reading_template: >
    FunctionalRelation(R,X,Y) \Longleftrightarrow R is a relation from X
    to Y and each x in X is related to at most one y in Y.
  note: "Functional means single-valued; it does not by itself assert totality."

- id: pred:total-relation
  name: TotalRelation
  category: relation
  arity: 3
  arguments: [R, X, Y]
  optional_arguments: []
  formal: >
    Relation(R,X,Y) \land
    \forall x \in X \; \exists y \in Y \; ((x,y) \in R)
  reading_template: >
    TotalRelation(R,X,Y) \Longleftrightarrow R is a relation from X to Y
    and every x in X is related to at least one y in Y.
  note: "Total means every input has a value; it does not by itself assert uniqueness."

- id: pred:graph-of
  name: GraphOf
  category: relation
  arity: 4
  arguments: [R, f, X, Y]
  optional_arguments: []
  formal: >
    f:X\to Y \land R=\{(x,f(x)):x\in X\}
  reading_template: >
    GraphOf(R,f,X,Y) \Longleftrightarrow R is the graph of the function
    f:X\to Y.
  note: "Used when a functional and total relation is packaged as a function."

- id: pred:minimal-relation
  name: MinimalRelation
  category: relation
  arity: 2
  arguments: [R, C]
  optional_arguments: []
  formal: "R = \\bigcap\\{Q : C(Q)\\}"
  reading_template: >
    MinimalRelation(R,C) \Longleftrightarrow R is the intersection of all
    relations satisfying the closure condition C.
  note: >
    Generic minimal-relation construction. The second argument C names the
    admissibility or closure condition; do not specialize the predicate name
    to a particular construction such as iterator relations.

- id: pred:isomorphism
  name: Isomorphism
  category: structure
  arity: 2
  arguments: [A, B]
  optional_arguments: [theta]
  formal: >
    \exists \theta \;(\theta:A\cong B)
  reading_template: >
    Isomorphism(A,B) \Longleftrightarrow there exists a structure-preserving
    bijection from A to B.
  note: >
    Generic structural isomorphism predicate. A and B are structured objects.
    The optional witness theta may be supplied in prose or a predicate-reading
    remark, but theta is not part of the predicate name.

- id: pred:peano-system
  name: PeanoSystem
  category: peano
  arity: 1
  arguments: [A]
  optional_arguments: []
  formal: "A=(P,S,1) \\text{ satisfies the Peano system axioms}"
  reading_template: >
    PeanoSystem(A) \Longleftrightarrow A is a Peano system.
  note: "Use A for the whole structure when the structure, rather than only P, is the object."

- id: pred:iterator-data
  name: IteratorData
  category: recursion
  arity: 3
  arguments: [W, c, g]
  optional_arguments: [A]
  formal: "W \\text{ is a set} \\land c\\in W \\land g:W\\to W"
  reading_template: >
    IteratorData(W,c,g) \Longleftrightarrow W is a value set, c is an
    initial value in W, and g is a self-map of W.
  note: "The optional context A is the Peano system along which the data are iterated."

- id: pred:iterator-relation
  name: IteratorRelation
  category: recursion
  arity: 5
  arguments: [R, A, W, c, g]
  optional_arguments: []
  formal: >
    A=(P,S,1) \land Relation(R,P,W) \land (1,c)\in R
    \land \forall n\in P \; \forall w\in W \;
    ((n,w)\in R \rightarrow (S(n),g(w))\in R)
  reading_template: >
    IteratorRelation(R,A,W,c,g) \Longleftrightarrow R is a relation in
    P \times W containing the base pair and closed under the iterator step
    for A=(P,S,1).
  note: "Use R for arbitrary admissible iterator relations and R^* for the minimal one."

- id: pred:iterator-function
  name: IteratorFunction
  category: recursion
  arity: 5
  arguments: [f, A, W, c, g]
  optional_arguments: []
  formal: >
    A=(P,S,1) \land f:P\to W \land f(1)=c
    \land \forall n\in P \;(f(S(n))=g(f(n)))
  reading_template: >
    IteratorFunction(f,A,W,c,g) \Longleftrightarrow f satisfies the base
    and successor clauses for the iterator data over A=(P,S,1).
  note: "This is the predicate form of the Peano iterator clauses."

- id: pred:iterator-generated-function
  name: IteratorGeneratedFunction
  category: recursion
  arity: 5
  arguments: [f, A, W, c, g]
  optional_arguments: []
  formal: 'IteratorFunction(f,A,W,c,g) \land \exists! h\;IteratorFunction(h,A,W,c,g)'
  reading_template: >
    IteratorGeneratedFunction(f,A,W,c,g) \Longleftrightarrow f is the
    unique iterator function determined by W,c,g over A.
  note: "Use after the Peano Iterator Theorem has supplied existence and uniqueness."

- id: pred:stage-dependent-step-rule
  name: StageDependentStepRule
  category: recursion
  arity: 3
  arguments: [Phi, P, W]
  optional_arguments: []
  formal: "\\Phi:P\\times W\\to W"
  reading_template: >
    StageDependentStepRule(\Phi,P,W) \Longleftrightarrow \Phi is a function
    from stage-value pairs into W.
  note: "Use Phi in YAML for the symbol \\Phi."

- id: pred:general-recursive-function
  name: GeneralRecursiveFunction
  category: recursion
  arity: 5
  arguments: [f, A, W, c, Phi]
  optional_arguments: []
  formal: >
    A=(P,S,1) \land f:P\to W \land f(1)=c
    \land \forall n\in P \;(f(S(n))=\Phi(n,f(n)))
  reading_template: >
    GeneralRecursiveFunction(f,A,W,c,\Phi) \Longleftrightarrow f satisfies
    the base clause and the stage-dependent successor clause over A.
  note: "Stage-dependent analogue of IteratorFunction."
