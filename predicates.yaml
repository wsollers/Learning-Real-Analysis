# =========================================================
# Limits
# =========================================================

- id: pred:function-limit
  name: FunctionLimit
  category: limit
  arity: 4
  arguments: [f, A, c, L]
  optional_arguments: [d_dom, d_cod]
  signature: FunctionLimit(f, A, c, L [, d_dom, d_cod])
  formal: >
    \forall \varepsilon\,
    \Bigl(\operatorname{PositiveOutputTolerance}(\varepsilon)
    \Rightarrow
    \exists \delta\,
    \bigl(\operatorname{PositiveInputTolerance}(\delta)
    \land
    \forall x \in A\,
    [\operatorname{InputTolerance}(x, c, \delta)
    \Rightarrow
    \operatorname{OutputTolerance}(f(x), L, \varepsilon)]\bigr)\Bigr)
  reading_template: >
    \begin{aligned}
    \operatorname{FunctionLimit}(f,A,c,L)
    &\Longleftrightarrow
    \forall \varepsilon\,
    \Bigl(\operatorname{PositiveOutputTolerance}(\varepsilon)
    \Rightarrow
    \exists \delta\,
    \bigl(\operatorname{PositiveInputTolerance}(\delta)
    \land
    \forall x \in A\,
    [\operatorname{InputTolerance}(x,c,\delta)
    \Rightarrow
    \operatorname{OutputTolerance}(f(x),L,\varepsilon)]\bigr)\Bigr).
    \end{aligned}
  note: >
    Quantifiers are typed: PositiveOutputTolerance(eps) names the
    demanded positive precision; PositiveInputTolerance(delta) names
    the positive responding tolerance. The input condition is
    punctured, via InputTolerance(x,c,delta), distinguishing this from
    ContinuousAt where Within(x,c,delta) permits x = c.

- id: pred:left-limit
  name: LeftLimit
  category: limit
  arity: 3
  arguments: [f, c, L]
  optional_arguments: []

- id: pred:right-limit
