    items:
      - item_id: ex-deriv-rules-001
        status: corrected
        skill_tags:
          - fluency
          - rework
        exercise: "Differentiate y = -7x^5 - 4x^3 + 9x - 2."
        result: "-35x^4 - 12x^2 + 9"
        verification:
          status: corrected
          notes: "The memorialized image has a negative leading coefficient; the derivative keeps that sign."
      - item_id: ex-deriv-rules-002
        status: corrected
        skill_tags:
          - fluency
          - rework
        exercise: "Differentiate f(x) = x^2 sin x."
        result: "2x sin x + x^2 cos x"
        verification:
          status: corrected
          notes: "Problem was initially copied as a quotient; corrected source expression is the product x^2 sin x."
        rework_notes:
          - "Do not restore the discarded quotient transcription during path or topic refactors."
      - item_id: ex-deriv-rules-003
        status: complete
        skill_tags:
          - fluency
          - concept_application
        exercise: "Differentiate y = (x^2 + 1)/(x - 3)."
        result: "((x - 3)(2x) - (x^2 + 1))/(x - 3)^2 = (x^2 - 6x - 1)/(x - 3)^2"
        verification:
          status: correct
          notes: "Quotient rule applied correctly; final simplification added."
      - item_id: ex-deriv-rules-004
        status: complete
        skill_tags:
          - fluency
          - concept_application
        exercise: "Differentiate f(x) = sqrt(3x^2 + 5x + 1)."
        result: "(6x + 5)/(2 sqrt(3x^2 + 5x + 1))"
        verification:
          status: correct
          notes: "Chain rule applied correctly."
      - item_id: ex-deriv-rules-005
        status: corrected
        skill_tags:
          - fluency
          - concept_application
          - rework
        exercise: "Differentiate f(x) = x^2 sin x/(1 + x^2)."
        result: "(2x sin x + x^2(1 + x^2) cos x)/(1 + x^2)^2"
        verification:
          status: corrected
          notes: "The handwritten work used a valid product/quotient split; the final expression is consolidated."
      - item_id: ex-deriv-rules-006
        status: complete
        skill_tags:
          - fluency
          - concept_application
        exercise: "Differentiate f(x) = e^(x^2) cos x."
        result: "e^(x^2)(2x cos x - sin x)"
        verification:
          status: correct
          notes: "Product rule and chain rule applied correctly."
      - item_id: ex-deriv-rules-007
        status: complete
        skill_tags:
          - fluency
          - concept_application
        exercise: "Differentiate f(x) = ln(1 + x^4)."
        result: "4x^3/(1 + x^4)"
        verification:
          status: correct
          notes: "Logarithmic chain rule applied correctly."
      - item_id: ex-deriv-rules-008
        status: corrected
        skill_tags:
          - fluency
          - concept_application
          - rework
        exercise: "Differentiate f(x) = sqrt(x^2 + 1)/(x^3 - 2x + 1)."
        result: "((x^3 - 2x + 1)x/sqrt(x^2 + 1) - sqrt(x^2 + 1)(3x^2 - 2))/(x^3 - 2x + 1)^2"
        verification:
          status: corrected
          notes: "Quotient-rule structure is correct; the derivative of sqrt(x^2+1) is x/sqrt(x^2+1)."
